<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SYSINT2 Midterm Units 3-5 Quiz and Reviewer</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f5;--card:#fff;--ink:#14213d;--mute:#5b6b82;--line:#d3dbe4;--acc:#0f8b8d;--accbg:#d9f0f0;--ok:#237a4b;--okbg:#dff3e6;--bad:#b83a30;--badbg:#fbe3e0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1623;--card:#172236;--ink:#e8eef7;--mute:#9fb0c6;--line:#2a3a54;--acc:#4fc3c5;--accbg:#12383b;--ok:#6fd49b;--okbg:#14301f;--bad:#ff8f84;--badbg:#3b1a17}}
:root[data-theme="dark"]{--bg:#0e1623;--card:#172236;--ink:#e8eef7;--mute:#9fb0c6;--line:#2a3a54;--acc:#4fc3c5;--accbg:#12383b;--ok:#6fd49b;--okbg:#14301f;--bad:#ff8f84;--badbg:#3b1a17}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5}
#app{max-width:720px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:2rem;line-height:1.1;margin:.2em 0 .3em;font-weight:800}
h2{font-size:1.2rem;margin:1.4em 0 .5em}
p{margin:.4em 0}.mute{color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
button{font:inherit;cursor:pointer;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:11px 16px}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button.pri{background:var(--acc);border-color:var(--acc);color:#04201f;font-weight:600}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.row>*{flex:1 1 140px}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--acc);transition:width .25s}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.9rem}
.part{font-weight:600;color:var(--acc)}
.q{font-size:1.2rem;font-weight:600;margin:6px 0 14px;white-space:pre-line}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px}
.opt b{display:inline-block;width:1.6em}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad)}
input[type=text]{width:100%;font:inherit;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.fb{border-radius:10px;padding:12px 14px;margin-top:12px}.fb.ok{background:var(--okbg);border-left:5px solid var(--ok)}.fb.bad{background:var(--badbg);border-left:5px solid var(--bad)}
.ft{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ft .opt{margin:0;text-align:center;font-weight:600}
.score{font-size:3.4rem;font-weight:800;line-height:1}
table{border-collapse:collapse;width:100%;font-size:.95rem}th,td{border:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}th{background:var(--accbg)}
.scroll{overflow-x:auto}
details{border:1px solid var(--line);border-radius:10px;margin:8px 0;background:var(--card)}summary{padding:12px;cursor:pointer;font-weight:600}details>div{padding:0 12px 12px}
.big{font-size:1.15rem;font-weight:700}
ul{padding-left:1.2em;margin:.4em 0}li{margin:.2em 0}
</style>
</head>
<body>
<div id="app"></div>
<script>
const MC=[
["Which of the following best describes feedback in system integration?",["Information about system behavior used to determine a subsequent action.","Information about system architecture used to determine the next component.","Information about system behavior used to document a previous action.","Information about system performance used only to report completed actions."],0,"Feedback is information used to decide the next action."],
["Which of the following best describes the focus of the Second Way of DevOps?",["Understanding what is happening in the system through fast and effective feedback.","Understanding how software is deployed through automated delivery processes.","Understanding how work moves through the system during software delivery.","Understanding how components are connected through system architecture."],0,"Second Way = feedback. (First Way = flow of work.)"],
["Which of the following best describes a health check in a distributed system?",["A mechanism that determines whether a component or service is functioning properly.","A mechanism that measures the numerical performance of a service.","A mechanism that records events generated by a service.","A mechanism that follows a request across multiple services."],0,""],
["Which is an example of development feedback that detects a problem before deployment?",["An automated integration test reports a failure after a code change.","A monitoring alert reports that server CPU usage exceeds its threshold.","An application log records a database timeout in production.","A user submits a support ticket after an enrollment request fails."],0,"Pre-production feedback happens before the software is live."],
["Which best describes the primary purpose of distributed tracing?",["Following a request across multiple components to identify where processing time was spent.","Recording events across multiple components to identify when an error occurred.","Measuring numerical values across multiple components to identify changes in performance.","Notifying engineers across multiple components when a threshold is exceeded."],0,"TRACE = WHERE did it go?"],
["Which feedback source primarily answers the question, \"What happened?\"",["Logs, which record events and messages generated by a system.","Traces, which show the path of a request across components.","Alerts, which notify engineers when a condition requires attention.","Metrics, which measure numerical values of system behavior."],0,"LOG = WHAT happened?"],
["Which best reflects a feedback-driven approach after a system failure?",["Examining the conditions that allowed the failure, evaluating the response, and identifying improvements.","Identifying the person responsible and documenting the cause of the failure.","Identifying the failed component and restarting it whenever the problem recurs.","Restoring service and closing the incident once users can access the system."],0,"Ask what conditions allowed the failure, not only who caused it."],
["Which is an example of a metric rather than a log, trace, or alert?",["\"Database query response time = 4.2 seconds.\"","\"Database connection usage exceeded the configured threshold.\"","\"Database timeout occurred at 10:15:12.\"","\"Request REQ-1001 traveled through the API, service, and database.\""],0,"Metric = number. The others are an alert, a log, and a trace."],
["Which helps engineers associate related events from the same request across different services?",["A correlation ID or request ID shared across related events.","An alert that reports when a service exceeds its threshold.","A metric that records the response time of each service.","A health check that reports whether each service is functioning."],0,""],
["Which best describes verification after a system response?",["Checking whether the response actually returned the system to an acceptable operating condition.","Checking whether the response was recorded in the incident log.","Checking whether the response was completed before the incident was reported.","Checking whether the response was performed according to the incident procedure."],0,"Did the response actually solve the problem?"],
["Which feedback source is the absolute fastest feedback loop?",["Compiler errors","Code review comments","Deployment result","User support report"],0,""],
["Which feedback source is the slowest, most expensive, and least desirable?",["User support report","Static analysis","Integration test","Alerting"],0,"The Human Layer is the last resort."],
["Which feedback source scans the raw text of code without running it, like a spellchecker?",["Static analysis","Unit test","Deployment result","Application log"],0,""],
["Which feedback checks whether multiple parts of a system (like the app and the database) work correctly when combined?",["Integration test","Unit test","Static analysis","Code review"],0,""],
["Which feedback source tells you whether a web request succeeded (200 OK) or failed (404, 500)?",["API (HTTP response)","Application log","Monitoring dashboard","Code review"],0,""],
["A warning is sent because CPU has been at 95% for more than 5 minutes. Which feedback source is this?",["Alerting (threshold violation)","Monitoring (system metrics)","Application log","Integration test"],0,""],
["Why does fast feedback matter?",["It helps detect problems as close as possible to where they are introduced.","It allows users to discover bugs first.","It removes the need for testing.","It delays problem detection until production."],0,"Fixing a bug in production can cost up to 100x more."],
["In slow feedback, what happens when the developer finally learns about the bug through a support ticket?",["They must stop their new work and re-learn the old code (context switching).","They are still immersed in the exact logic.","They fix it within seconds.","They never need to open the old project."],0,""],
["In the Unit 3 feedback loop table, which stage is: \"Telemetry tools pick up a sudden spike in failed requests\"?",["Observation","Action","Verification","Next Action"],0,"Observation = sensors or tools detect a shift."],
["In the Unit 3 table, an automated system sends an email or PagerDuty alarm to the engineer. Which stage is this?",["Feedback","Observation","Response","Verification"],0,"Feedback = the observation is packaged and delivered."],
["The developer redeploys the fix and watches the dashboard until the error rate returns to normal. Which stage is this?",["Verification","Response","Result","Next Action"],0,""],
["According to Unit 5, what follows Detection in the complete process?",["Analysis, Response, Recovery, Verification, Improvement","Response, Analysis, Verification, Recovery, Improvement","Recovery, Response, Analysis, Improvement, Verification","Verification, Analysis, Response, Recovery, Improvement"],0,"Problem, Detection, Analysis, Response, Recovery, Verification, Improvement."],
["Why is \"no more complaints\" insufficient to prove the system is healthy?",["Absence of complaints does not necessarily prove the system is healthy.","Users never complain about real problems.","Complaints are always wrong.","Metrics are never reliable."],0,"Monitor, check metrics, check logs, then verify."],
["Enrollment Service is running, but its database is unavailable. Which statement matches the module?",["Application Health ≠ Complete System Health","Application Health = Complete System Health","Dependencies do not affect applications","The system is fully healthy"],0,""]
];
const ID=[
["It is the DevOps way that focuses on knowing what is happening in the system through fast and effective feedback.",["second way","the second way","second way of devops"],"Second Way"],
["It is a defined value used to determine when a system condition requires attention.",["threshold"],"Threshold"],
["It is a defined endpoint, such as GET /health, used to check whether a service is functioning properly.",["health check"],"Health Check"],
["It is the process of returning a system to an acceptable operating condition after a failure.",["recovery"],"Recovery"],
["It is the action taken after analyzing feedback, such as correcting a configuration or rolling back a deployment.",["response"],"Response"],
["It is the time required to restore normal system operation.",["recovery time"],"Recovery Time"],
["It is a numerical measurement of system behavior, such as CPU usage, error rate, or response time.",["metric","metrics"],"Metrics"],
["It is a notification indicating that a condition requiring attention has occurred.",["alerting","alert"],"Alerting"],
["It is the process of checking whether a response actually solved the problem.",["verification"],"Verification"],
["It is the ability to understand a system's internal state and behavior by examining the information it produces.",["observability"],"Observability"],
["It is an event that affects or threatens the normal operation of a system.",["incident"],"Incident"],
["It is a continuous process where system output or results are fed back into the system to improve future performance and resolve problems.",["feedback loop"],"Feedback Loop"],
["It is the feedback source that tracks traffic volumes, error rates, and system uptime through overall system health information.",["monitoring"],"Monitoring"],
["It is feedback that checks whether multiple parts of a system, such as an application and database, work correctly when combined.",["integration test","integration testing","integration tests","integration"],"Integration Test"],
["It is source-code feedback where tools scan the code without running it, like a spellchecker.",["static analysis","static code analysis"],"Static Analysis"],
["It is the fastest feedback loop: the language says the code cannot run because of a syntax mistake.",["compiler errors","compiler error","compiler"],"Compiler Errors"],
["It is the human-layer feedback source, the slowest, most expensive, and least desirable one.",["user support report","support report","support ticket","user","user layer"],"User (support report)"],
["It is an identifier shared across services to connect events belonging to the same request.",["request id","correlation id","request id / correlation id"],"Request ID / Correlation ID"],
["It follows a request across multiple components to show where processing time was spent.",["distributed tracing","distributed trace","trace","tracing"],"Distributed Tracing"],
["It means recognizing that the system has entered an abnormal or undesirable state.",["detection"],"Detection"]
];
const SOL=[
["1,000 requests were made and 50 failed. What is the error rate?",["5%","5","5 percent"],"5%"],
["2,000 requests were made and 400 failed. What is the error rate?",["20%","20","20 percent"],"20%"],
["8 out of 200 requests failed. What is the error rate?",["4%","4","4 percent"],"4%"],
["Trace: API Gateway = 20 ms, Enrollment Service = 80 ms, Database = 1,800 ms. What is the total approximate processing time?",["1900 ms","1900","1900 milliseconds","1.9 seconds"],"1,900 ms"],
["Trace REQ-1001: API Gateway = 10 ms, Enrollment Service = 40 ms, Database = 850 ms. What is the total?",["900 ms","900","900 milliseconds"],"900 ms"],
["Trace: API Gateway = 40 ms, Enrollment Service = 60 ms, Database Query = 4,500 ms. Which component is the slowest?",["database","database query"],"Database"],
["Error rate fell from 15% to 2% after a fix. By how many percentage points did it decrease?",["13","13%","13 percentage points","13 percent"],"13 percentage points"],
["Response time fell from 7 seconds to 1.5 seconds after a fix. By how many seconds did it decrease?",["5.5","5.5 seconds","5.5 sec"],"5.5 seconds"],
["Error rate was normally 1% and rose to 20% during an incident. By how many percentage points did it increase?",["19","19%","19 percentage points","19 percent"],"19 percentage points"],
["A service failed at 10:15 and was restored at 10:40. What is the recovery time?",["25 minutes","25 min","25 mins","25"],"25 minutes"],
["The system receives 150 requests per second. How many requests arrive in 60 seconds?",["9000","9000 requests","9,000"],"9,000"],
["Threshold: CPU > 90%. Actual CPU = 88%. Is the threshold exceeded? (Yes or No)",["no","not exceeded","no violation"],"No"],
["Threshold: Database Connections > 90%. Actual = 97%. Is the threshold exceeded? (Yes or No)",["yes","exceeded","threshold exceeded"],"Yes"]
];
const SA="Situation: University Enrollment System\nNormal vs during incident: API error rate 1% → 20%, API response time 1.2 s → 9.2 s, Database query time 0.8 s → 8.5 s, CPU 50% → 50%, Database connections 55% → 97%.\n\n";
const SB="Situation: Online Enrollment with Payment\nStudent Portal → API Gateway → Enrollment Service → Payment Service → External Payment API. Payments fail. API Gateway = 200 (30 ms), Enrollment Service = 200 (70 ms), Payment Service log: \"Payment API 503 Service Unavailable\", CPU = 35%.\n\n";
const SIT=[
[SA+"Which measurement stayed the same during the incident?",["cpu","cpu usage"],"CPU usage"],
[SA+"Which system component should be investigated first?",["database"],"Database"],
[SA+"Which database measurement rose from 55% to 97%?",["database connections","connections","connection usage","database connection usage"],"Database connections"],
[SA+"What feedback mechanism follows a request across the API Gateway, Enrollment Service, and Database?",["distributed tracing","distributed trace","trace","traces","tracing"],"Distributed tracing"],
[SA+"After the fix, error rate drops to 1.5% and response time to 1.5 seconds. What should the team do next?",[],"Verify the system using metrics",["verif","monitor","check metric","metrics"]],
[SA+"Give one improvement that could help detect a similar database problem earlier.",[],"Set up a database connection usage threshold and alert",["threshold","alert","monitor","health check"]],
[SB+"Which component is the likely problem location?",["payment api","external payment api","the payment api","external dependency","payment service"],"External Payment API"],
[SB+"Which feedback source recorded the 503 message?",["log","logs","application log","application logs"],"Application log"],
[SB+"Does CPU = 35% show that a CPU overload caused the failure? (Yes or No)",["no"],"No"],
[SB+"The Enrollment Service returned 200 and looks healthy. What does this show about application health and system health?",[],"Application health is not the same as complete system health",["not","≠","differ","dependency","depend"]],
[SB+"What should the team do after the Payment API is restored?",[],"Verify using metrics and logs",["verif","monitor","check"]],
[SB+"Give one improvement for detecting this problem earlier.",[],"Add a health check, monitoring, and alert for the Payment API",["health check","alert","monitor","threshold"]]
];
const FT=[
["Database timeout occurred","Log"],
["CPU = 92%","Metric"],
["Request ID REQ-1001 traveled through API, Service, then DB","Trace"],
["Error rate exceeded 5%, notification sent","Alert"],
["User authentication failed","Log"],
["Response time = 4.2 seconds","Metric"],
["Database Connections > 90% triggered a notification to the engineer","Alert"],
["10:15:12 Enrollment request failed","Log"]
];
const FTX={Log:"Recorded event or message: WHAT happened.",Metric:"Numerical measurement: HOW MUCH / HOW OFTEN.",Trace:"Follows one request across components: WHERE it went.",Alert:"Notification that someone needs to ACT."};
const PARTS=["Part I: Multiple choice","Part II: Identification","Part III: Solving","Part IV: Situation analysis","Part V: Identify the feedback type"];
const mcmap=(x,pi)=>{const ord=shuf(x[1].map((_,j)=>j));return {t:"mc",p:PARTS[pi],q:x[0],o:ord.map(j=>x[1][j]),a:ord.indexOf(x[2]),e:x[3]}};
const idmap=(x,pi)=>({t:"id",p:PARTS[pi],q:x[0],al:x[1],d:x[2],kw:x[3]});
const Q=[
...MC.map(x=>mcmap(x,0)),
...ID.map(x=>idmap(x,1)),
...SOL.map(x=>idmap(x,2)),
...SIT.map(x=>idmap(x,3)),
...FT.map(x=>({t:"ft",p:PARTS[4],q:x[0],a:x[1],e:FTX[x[1]]}))
];
const L2="ABCD";
const app=document.getElementById("app");
let L=[],A={},i=0,view="home";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,"");
const checkId=(q,v)=>{const n=norm(v);if(n==="")return false;if(q.kw&&q.kw.some(k=>n.includes(norm(k))))return true;return q.al.some(a=>norm(a)===n||norm(a)+"s"===n)};
const correctText=q=>q.t==="mc"?L2[q.a]+". "+q.o[q.a]:q.t==="id"?q.d:q.a;
const yourText=(q,a)=>a?(q.t==="mc"?L2[a.v]+". "+q.o[a.v]:a.v):"(no answer)";
const allIdx=()=>Q.map((_,k)=>k);
const wrongIdx=()=>L.filter(k=>A[k]&&!A[k].ok);
function go(v){view=v;render();window.scrollTo(0,0)}
let jumble=true;
function shuf(a){a=a.slice();for(let n=a.length-1;n>0;n--){const m=Math.floor(Math.random()*(n+1));[a[n],a[m]]=[a[m],a[n]]}return a}
function start(list){L=jumble?shuf(list):list.slice();A={};i=0;go("quiz")}
function render(){({home,quiz,results,reviewer})[view]()}

function home(){
app.innerHTML=`<p class="part">SYSINT2 · Midterm formative</p><h1>Units 3, 4 and 5: Feedback and Reliability</h1>
<p class="mute">${Q.length} practice questions in the style of the formative: multiple choice, identification, solving, situation analysis, and identify the feedback type. Each answer shows instant feedback, and you can go back to earlier questions.</p>
<div class="card"><p class="big">Memorize this first</p>
<p><b>Detect → Analyze → Respond → Recover → Verify → Improve</b></p><p><b>LOG</b> = WHAT happened · <b>METRIC</b> = HOW MUCH · <b>TRACE</b> = WHERE it went · <b>ALERT</b> = ACT</p><p class="mute">An alert is not a solution, and a fix is not proof of recovery.</p></div>
<div class="row"><button class="pri" id="s1">Start full quiz</button><button id="s2">Open reviewer</button></div>
<label style="display:flex;gap:10px;align-items:center;margin-top:16px;cursor:pointer"><input type="checkbox" id="jb" ${jumble?"checked":""} style="width:20px;height:20px"> Jumble the question order</label>
<h2>Or practice one part</h2>
<div class="row">${PARTS.map((p,k)=>`<button data-p="${k}">${p}</button>`).join("")}</div>`;
document.getElementById("s1").onclick=()=>start(allIdx());
document.getElementById("s2").onclick=()=>go("reviewer");
document.getElementById("jb").onchange=e=>{jumble=e.target.checked};
app.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>start(allIdx().filter(k=>Q[k].p===PARTS[b.dataset.p])));
}

function quiz(){
const k=L[i],q=Q[k],a=A[k],done=Object.keys(A).length;
let body="";
if(q.t==="mc"){
body=q.o.map((o,j)=>{let c="";if(a){if(j===q.a)c="ok";else if(j===a.v)c="bad"}
return `<button class="opt ${c}" data-j="${j}" ${a?"disabled":""}><b>${L2[j]}.</b> ${esc(o)}</button>`}).join("");
}else if(q.t==="id"){
body=`<input type="text" id="idv" placeholder="Type your answer" autocomplete="off" ${a?"disabled":""} value="${a?esc(a.v):""}">
${a?"":`<div class="row"><button class="pri" id="sub">Submit answer</button></div>`}`;
}else{
body=`<div class="ft">${["Log","Metric","Trace","Alert"].map(o=>{let c="";if(a){if(o===q.a)c="ok";else if(o===a.v)c="bad"}
return `<button class="opt ${c}" data-v="${o}" ${a?"disabled":""}>${o}</button>`}).join("")}</div>`;
}
let fb="";
if(a){fb=a.ok?`<div class="fb ok"><b>Correct.</b> ${esc(q.e||"")}</div>`
:`<div class="fb bad"><b>Not quite.</b> You answered: ${esc(yourText(q,a))}<br>Correct answer: <b>${esc(correctText(q))}</b>${q.e?"<br>"+esc(q.e):""}</div>`}
const last=i===L.length-1;
app.innerHTML=`<div class="top"><span class="part">${q.p}</span><span>${i+1} / ${L.length}</span></div>
<div class="bar"><i style="width:${done/L.length*100}%"></i></div>
<div class="card"><div class="q">${esc(q.q)}</div>${body}${fb}</div>
<div class="row"><button id="back" ${i===0?"disabled":""}>Back</button>
<button class="pri" id="next" ${a?"":"disabled"}>${last?"See results":"Next"}</button></div>
<div class="row"><button id="exit">Exit to menu</button><button id="rv">Open reviewer</button></div>
<p class="mute" style="font-size:.85rem;margin-top:14px">${q.t==="mc"?"Keyboard: 1 = A, 2 = B, 3 = C, 4 = D. Press Enter for the next question.":q.t==="ft"?"Keyboard: 1 = Log, 2 = Metric, 3 = Trace, 4 = Alert. Press Enter for the next question.":"Keyboard: Enter submits your answer, then Enter again goes to the next question."}</p>`;
const ans=(v,ok)=>{A[k]={v,ok};render()};
app.querySelectorAll("[data-j]").forEach(b=>b.onclick=()=>ans(+b.dataset.j,+b.dataset.j===q.a));
app.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>ans(b.dataset.v,b.dataset.v===q.a));
const sub=document.getElementById("sub"),inp=document.getElementById("idv");
if(sub){const f=()=>{const v=inp.value.trim();if(!v){inp.focus();return}ans(v,checkId(q,v))};sub.onclick=f;inp.onkeydown=e=>{if(e.key==="Enter")f()};inp.focus()}
document.getElementById("back").onclick=()=>{i--;render()};
document.getElementById("next").onclick=()=>{if(last)go("results");else{i++;render()}};
document.getElementById("exit").onclick=()=>go("home");
document.getElementById("rv").onclick=()=>go("reviewer");
}

document.addEventListener("keydown",e=>{
if(view!=="quiz"||e.repeat||e.ctrlKey||e.metaKey||e.altKey)return;
const t=e.target,tag=t&&t.tagName;if(tag==="INPUT")return;
const a=A[L[i]];
if(e.key==="Enter"){if(tag==="BUTTON"||!a)return;e.preventDefault();const n=document.getElementById("next");if(n&&!n.disabled)n.click();return}
if(a||!/^[1-4]$/.test(e.key))return;
const j=+e.key-1,q=Q[L[i]];
const b=q.t==="mc"?app.querySelector('[data-j="'+j+'"]'):q.t==="ft"?app.querySelectorAll("[data-v]")[j]:null;
if(b&&!b.disabled){e.preventDefault();b.click()}
});

function results(){
const total=L.length,right=L.filter(k=>A[k]&&A[k].ok),wr=wrongIdx(),skipped=total-L.filter(k=>A[k]).length;
const pct=Math.round(right.length/total*100);
const per=PARTS.map(p=>{const ks=L.filter(k=>Q[k].p===p);if(!ks.length)return"";const r=ks.filter(k=>A[k]&&A[k].ok).length;return `<tr><td>${p}</td><td>${r} / ${ks.length}</td></tr>`}).join("");
app.innerHTML=`<p class="part">Results</p><div class="card"><div class="score">${right.length} / ${total}</div>
<p class="big">${pct}% · ${pct>=90?"Excellent!":pct>=75?"Good job!":pct>=50?"Keep reviewing.":"Review the module, then retry."}</p>
${skipped?`<p class="mute">${skipped} question(s) not answered yet.</p>`:""}
<div class="scroll"><table>${per}</table></div></div>
<h2>Review your mistakes (${wr.length})</h2>
${wr.length?wr.map(k=>{const q=Q[k];return `<details><summary>${esc(q.q.split("\n")[0])}</summary><div>
<p>Your answer: <b style="color:var(--bad)">${esc(yourText(q,A[k]))}</b></p>
<p>Correct answer: <b style="color:var(--ok)">${esc(correctText(q))}</b></p>
${q.e?`<p class="mute">${esc(q.e)}</p>`:""}
<button data-g="${k}">Go to this question</button></div></details>`}).join(""):`<div class="card">No wrong answers. Nice!</div>`}

<h2>UNIT 4: Distributed systems and observability</h2>

<ul><li><b>Structured log:</b> fields like timestamp, service, request_id, status, message, easy to search.</li>

<h2>UNIT 5: Using feedback to improve reliability</h2>
<details open><summary>The process</summary><div><p>Alert is only the beginning:</p>
<p><b>Problem → Detection → Analysis → Response → Recovery → Verification → Improvement</b></p>
<ul><li><b>Detection:</b> recognizing the system entered an abnormal or undesirable state (normal error rate 1%, now 8%).</li>
<li><b>Threshold:</b> defined value that says when attention is needed (CPU > 90%: 75% is fine, 95% exceeds).</li>
<li><b>Alerting:</b> communicates that a condition needs attention. Purpose: shorten the time between problem and human awareness.</li>
<li><b>Incident:</b> event that affects or threatens normal operation (app unavailable, database unavailable, API failure, authentication failure, severe slowdown, failed deployment).</li>
<li><b>Analysis:</b> check logs, metrics, traces, recent changes, health checks, then identify the possible cause. It is an evidence-based investigation.</li>
<li><b>Response:</b> action after analysis (restart a service, correct config, rollback, fix code, fix database, scale).</li>
<li><b>Recovery:</b> returning to an acceptable operating condition. Do not assume it is complete, always verify.</li>
<li><b>Verification:</b> did the response actually solve the problem? (Error rate 20% before, 1% after.)</li>
<li><b>Improvement:</b> use findings to make the system better.</li>
<li><b>Rollback:</b> Version 2, Problem, Rollback, Version 1, Verify.</li></ul>
<p class="mute">"No more complaints" is not enough. Fix, monitor, check metrics, check logs, verify.</p></div></details>

<li><b>Post-incident review:</b> what happened, when, how detected, what feedback was available, what was missing, what response, did it work, how recovery was verified, what to improve.</li>
<li><b>Better feedback:</b> add health check, monitoring, and alert so problems are detected earlier.</li>
<li><b>Feedback quality:</b> Timely, Relevant, Understandable, Actionable, Accurate. "Database connection timeout" with service, request ID, and time beats "Something went wrong".</li></ul></div></details>
